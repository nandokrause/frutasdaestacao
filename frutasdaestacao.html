<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Frutas da Estação Brasil</title>

<style>

:root{
    --verde:#2e7d32;
    --verde-claro:#43a047;
    --fundo:#f4f6f8;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background:var(--fundo);
}

header{
    background:linear-gradient(135deg,var(--verde),var(--verde-claro));
    color:white;
    text-align:center;
    padding:40px 20px;
}

header h1{
    margin:0 0 10px;
}

header p{
    margin:0;
    opacity:0.95;
}

.filtros{
    max-width:1000px;
    margin:25px auto;
    background:white;
    padding:20px;
    border-radius:16px;
    box-shadow:0 2px 15px rgba(0,0,0,.08);

    display:grid;
    grid-template-columns:1fr 1fr auto;
    gap:15px;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:15px;
}

button{
    background:var(--verde);
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    transition:0.2s;
}

button:hover{
    background:#1b5e20;
}

.resultados{
    max-width:1200px;
    margin:20px auto 50px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:18px;
    padding:20px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
    transition:.3s;
    border-top:5px solid var(--verde-claro);
}

.card:hover{
    transform:translateY(-5px);
}

.icone{
    font-size:56px;
}

.card h3{
    margin:10px 0;
    color:var(--verde);
}

.status{
    display:inline-block;
    background:#c8e6c9;
    color:#1b5e20;
    padding:6px 12px;
    border-radius:20px;
    font-size:13px;
    font-weight:600;
}

.safra{
    margin-top:15px;
    background:#e8f5e9;
    padding:10px;
    border-radius:10px;
    color:#1b5e20;
    font-weight:600;
}

.estado{
    margin-top:12px;
    color:#666;
    font-size:14px;
}

.dica{
    margin-top:15px;
    padding-top:15px;
    border-top:1px solid #eee;
    color:#444;
    line-height:1.5;
}

.vazio{
    max-width:1000px;
    margin:40px auto;
    text-align:center;
    color:#666;
    font-size:18px;
}

.hero{
    position:relative;
    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            #1b5e20 0%,
            #2e7d32 35%,
            #43a047 100%
        );

    color:white;
    text-align:center;
    padding:70px 20px 90px;
}

.hero::before{
    content:"";
    position:absolute;
    width:350px;
    height:350px;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    top:-120px;
    left:-120px;
}

.hero::after{
    content:"";
    position:absolute;
    width:250px;
    height:250px;
    border-radius:50%;
    background:rgba(255,255,255,0.06);
    bottom:-100px;
    right:-80px;
}

.hero-content{
    position:relative;
    z-index:2;
    max-width:800px;
    margin:auto;
}

.badge{
    display:inline-block;
    padding:8px 16px;
    border-radius:30px;

    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(5px);

    margin-bottom:20px;
    font-size:14px;
    font-weight:600;
}

.hero h1{
    margin:0;
    font-size:clamp(2rem,5vw,3.7rem);
    font-weight:700;
    line-height:1.1;
}

.hero p{
    margin:20px auto 0;
    max-width:700px;
    font-size:1.15rem;
    line-height:1.7;
    opacity:0.95;
}

.hero-frutas{
    margin-top:35px;
    font-size:2rem;
    letter-spacing:6px;
    animation:flutuar 5s ease-in-out infinite;
}

@keyframes flutuar{
    0%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-8px);
    }
    100%{
        transform:translateY(0);
    }
}
    
@media (max-width:700px){

    .filtros{
        grid-template-columns:1fr;
    }

    button{
        width:100%;
    }

}

</style>
</head>

function mesNaSafra(mes,inicio,fim){

    if(inicio <= fim){
        return mes >= inicio && mes <= fim;
    }

    return mes >= inicio || mes <= fim;
}

function pesquisar(){

    const data = document.getElementById("data").value;
    const estado = document.getElementById("estado").value;

    const resultado = document.getElementById("resultado");

    resultado.innerHTML = "";

    if(!data){

        resultado.innerHTML =
        '<div class="vazio">📅 Selecione uma data para consultar as frutas da estação.</div>';

        return;
    }

    const mes = new Date(data).getMonth() + 1;

    const frutasEncontradas = frutas.filter(fruta => {

        const emSafra = mesNaSafra(
            mes,
            fruta.inicio,
            fruta.fim
        );

        const estadoValido =
            !estado ||
            fruta.estados.includes(estado);

        return emSafra && estadoValido;

    });

    if(frutasEncontradas.length === 0){

        resultado.innerHTML =
        '<div class="vazio">😕 Nenhuma fruta encontrada para os filtros informados.</div>';

        return;
    }

    frutasEncontradas.forEach(fruta => {

        resultado.innerHTML += `
        <div class="card">

            <div class="icone">
                ${fruta.icone}
            </div>

            <h3>${fruta.nome}</h3>

            <div class="status">
                ✅ Em Safra
            </div>

            <div class="safra">
                📅 Safra: ${meses[fruta.inicio]} até ${meses[fruta.fim]}
            </div>

            <div class="estado">
                📍 Estados produtores:<br>
                ${fruta.estados.join(", ")}
            </div>

            <div class="dica">
                💡 ${fruta.dica}
            </div>

        </div>
        `;
    });
}
